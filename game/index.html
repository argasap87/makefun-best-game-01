<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberkeep — Lantern of the Last Dawn</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #070a14;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #0a0e1c;
    cursor: crosshair;
    image-rendering: auto;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
